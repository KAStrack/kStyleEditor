[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kstyle-editor"
version = "0.1.0"
description = "Server-side sanitiser for the CSS that kStyleEditor writes: parse, allow-list and re-serialise untrusted CSS declarations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["css", "sanitize", "sanitizer", "style-editor", "security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://kastrack.github.io/kStyleEditor/"
Source = "https://github.com/KAStrack/kStyleEditor"

[tool.setuptools]
packages = ["kstyle_editor"]
